server {
    listen 80;
    server_name localhost;

    # The Website (Frontend)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # The Multi-Channel Stream Gateway
    location ~ ^/radio/(.*)$ {
        proxy_buffering off;
        proxy_pass http://icecast:8000/$1;
        proxy_set_header Host $host;
    }


        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Audio Bridge (WebSocket)
    location /bridge {
        resolver 127.0.0.11 valid=30s;
        set $bridge_upstream bridge;
        proxy_pass http://$bridge_upstream:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }


    # Icecast Status Page

    location /status {
        proxy_pass http://icecast:8000/status.xsl;
    }

    location /status-json.xsl {
        proxy_pass http://icecast:8000/status-json.xsl;
    }

}
