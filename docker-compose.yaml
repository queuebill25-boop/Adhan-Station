services:
  # The "One Link" Gateway (Frontend + Proxy)
  frontend:
    build: .
    restart: unless-stopped

  # The WebRTC Media Server
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8189:8189/udp"
    environment:
      - MTX_API=yes
      - MTX_APIADDRESS=:9997
      - MTX_WEBRTC=yes
      - MTX_WEBRTCADDRESS=:8889
      - MTX_WEBRTCICEHOSTNAT1TO1IPS=127.0.0.1
      - MTX_AUTHINTERNALUSERS_0_USER=any
      - MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION=api
      - MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION=read
      - MTX_AUTHINTERNALUSERS_0_PERMISSIONS_2_ACTION=publish
