services:
  # The "One Link" Gateway (Frontend + Proxy)
  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      - mediamtx
      - icecast

  # The WebRTC Media Server
  mediamtx:
    build:
      context: .
      dockerfile: Dockerfile.mediamtx
    restart: unless-stopped
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"

  # Icecast (for ESP32 and legacy players)
  icecast:
    image: moul/icecast
    restart: unless-stopped
    volumes:
      - ./icecast.xml:/etc/icecast2/icecast.xml
    environment:
      - ICECAST_SOURCE_PASSWORD=dataq123
      - ICECAST_ADMIN_PASSWORD=dataq123
      - ICECAST_PASSWORD=dataq123

