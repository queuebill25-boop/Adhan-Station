services:
  # The "One Link" Gateway (Frontend + Proxy)
  frontend:
    build: .
    restart: unless-stopped

  # The WebRTC Media Server
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8189:8189/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    environment:
      - MTX_WEBRTCICEHOSTNAT1TO1IPS=127.0.0.1
