services:
  # The "One Link" Gateway (Frontend + Proxy)
  frontend:
    build: .
    restart: unless-stopped

  # The Streaming Backend
  icecast:
    image: moul/icecast
    restart: unless-stopped
    environment:
      - ICECAST_SOURCE_PASSWORD=dataq123
      - ICECAST_ADMIN_PASSWORD=dataq123
      - ICECAST_PASSWORD=dataq123

  # The Audio Bridge (WebSocket -> Icecast)
  bridge:
    image: node:18-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "apk add --no-cache ffmpeg && npm install ws && node bridge.js"
    depends_on:
      - icecast
