services:
  # The "One Link" Gateway (Frontend + Proxy)
  frontend:
    build: .
    restart: unless-stopped

  # The WebRTC Media Server
  mediamtx:
    build:
      context: .
      dockerfile: Dockerfile.mediamtx
    restart: unless-stopped
    ports:
      - "8189:8189/udp"
    environment:
      - MTX_WEBRTCICEHOSTNAT1TO1IPS=127.0.0.1
