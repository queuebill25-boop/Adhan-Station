<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhan Live | Community Broadcast</title>
    <meta name="description" content="Listen to live Adhan broadcasts from your local community. Clean, minimal, and high-fidelity live streaming.">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <main class="card">
            <header>
                <h1 class="logo">Adhan</h1>
                <p class="subtitle">Live Community Stream</p>
            </header>

            <section class="player-container central">
                <div class="stats-row">
                    <div id="liveBadge" class="status-badge">○ OFFLINE</div>
                    <div id="listenerCount" class="listener-count">0 Listeners</div>
                </div>

                <div class="controls-main">
                    <button id="playBtn" class="play-btn-large" aria-label="Play Adhan">
                        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                </div>

                <div class="volume-container">
                    <span class="vol-label">Volume Boost</span>
                    <input type="range" id="volumeSlider" min="0" max="2" step="0.01" value="1.0">
                </div>
            </section>


            <footer class="countdown-section">
                <div id="nextPrayerInfo">
                    <p class="prayer-name">Next: <span id="nextPrayerName">...</span> in</p>
                    <p class="timer" id="countdown">00:00:00</p>
                </div>
            </footer>
        </main>
        
        <div style="margin-top: 2rem; text-align: center;">
            <a href="/broadcast.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.8rem; opacity: 0.6;">Broadcaster Login</a>
        </div>
    </div>

    <audio id="streamAudio" preload="none"></audio>
    <script type="module" src="/main.js"></script>
</body>
</html>
