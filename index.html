<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhan Live | Community Broadcast</title>
    <meta name="description"
        content="Listen to live Adhan broadcasts from your local community. Clean, minimal, and high-fidelity live streaming.">
    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#020617">

</head>

<body>
    <div id="splash-screen">
        <div class="splash-content">
            <h1 class="logo" style="font-size: 3.5rem;">Adhan Live</h1>
            <p class="subtitle" style="margin-bottom: 40px;">Kudroli Jumma Masjid</p>

            <button id="enter-btn" class="enter-btn">PROCEED</button>
        </div>
    </div>

    <div id="app">

        <main class="card">
            <header>
                <h1 class="logo">Adhan</h1>
                <p class="subtitle">Kudroli Jumma Masjid</p>
            </header>


            <section class="player-container">

                <div class="status-badge">
                    <span id="liveBadge">○ OFFLINE</span>
                </div>

                <button id="playBtn" class="play-btn" aria-label="Play Adhan">
                    <!-- Play Icon -->
                    <svg id="playIcon" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                    <!-- Pause Icon (hidden by default) -->
                    <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                    </svg>
                </button>

                <div class="volume-container">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                    </svg>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
                </div>
            </section>

            <footer style="margin-top: 2rem; border-top: 1px solid var(--glass-border); padding-top: 1rem;">
                <p style="font-size: 0.7rem; color: var(--text-secondary); opacity: 0.5;">MANGALORE ADHAN NETWORK v4.0
                </p>
            </footer>
        </main>


        <div style="margin-top: 2rem; text-align: center;">
            <a href="/broadcast.html"
                style="color: var(--text-secondary); text-decoration: none; font-size: 0.8rem; opacity: 0.6;">Broadcaster
                Login</a>
        </div>
    </div>

    <audio id="streamAudio" preload="none"></audio>
    <script type="module" src="/main.js"></script>
</body>

</html>
