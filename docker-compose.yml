services:
  # The "One Link" Gateway (Frontend + Proxy)
  frontend:
    build: .
    restart: unless-stopped

  # The Streaming Backend
  icecast:
    image: moul/icecast
    restart: unless-stopped
    environment:
      - ICECAST_SOURCE_PASSWORD=dataq123
      - ICECAST_ADMIN_PASSWORD=dataq123
      - ICECAST_PASSWORD=dataq123

  # The Audio Bridge (Translates Browser Mic -> Icecast)
  bridge:
    image: jrottenberg/ffmpeg:4.4-alpine
    restart: unless-stopped
    command: >
      -i tcp://0.0.0.0:3001?listen
      -f mp3
      -acodec libmp3lame
      -ab 128k
      icecast://source:dataq123@icecast:8000/adhan_live
    depends_on:
      - icecast
