api: yes
apiAddress: :9997

webrtc: yes
webrtcAddress: :8889
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: [www.ejamaath.in]

authMethod: internal
authInternalUsers:
  - user: any
    permissions:
      - action: api
      - action: read
      - action: publish

paths:
  all:
    runOnReady: ffmpeg -fflags nobuffer -flags low_delay -probesize 32 -analyzeduration 0 -rtsp_transport tcp -i rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH -c:a libmp3lame -b:a 96k -ac 1 -flush_packets 1 -f mp3 icecast://source:dataq123@icecast:8000/$MTX_PATH
    runOnReadyRestart: yes
